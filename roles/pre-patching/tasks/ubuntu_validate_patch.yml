---
- name: Setting up the apt repo configuration to the desired state
  block:
    - name: Bring the apt repo configuration to the desired state
      apt_repository:
        repo: "{{ item.repo }}"
        state: "{{ item.state }}"
        filename: "{{ item.filename }}"
  when: apt_config is defined and apt_config is iterable 
  rescue:
    - name: Trigger the notification
      include_role: 
        name: post_patching
        tasks_from: notification.yml
      vars:
        mail_subject: "Patching failed during pre patch stage on host: {{ inventory_hostname }}"
        mail_body: "Error in setting up the apt repo config to desired state, before to perform patching at task: '{{ ansible_failed_task.name}}' for remote machine '{{ ansible_facts['distribution'] | lower }}'"
    - name: Fail the execution as there is an error in setting up apt repo configuration
      fail:
        msg: "Error in setting up the apt repo configuration to desired state, before to perform patching at task: '{{ ansible_failed_task.name}}' for remote machine '{{ ansible_facts['distribution'] | lower }}' "