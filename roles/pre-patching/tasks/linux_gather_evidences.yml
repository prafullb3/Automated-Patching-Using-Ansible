---
- name: Gather evidence for linux
  block:
    - name: Set evidence directory path 
      set_fact:
        evidence_path: "{{linux_temp_dir.rstrip('/')}}/{{evidence_dir}}"
    - name: Check if zip archive already exist 
      stat: 
        path: "{{evidence_path}}.zip"
      register: evidence_archive_already_exists
    - name: Remove if some older evidence already exists
      file: 
        state: absent 
        path: "{{evidence_path}}.zip"
      when: evidence_archive_already_exists.stat.exists
    - name: Create zip of evidences gathered 
      archive: 
        path: "{{evidence_path}}"
        dest: "{{evidence_path}}.zip"
        format: zip 
  rescue:
    - name: Trigger notification
      include_role:
        name: post_patching 
        tasks_from: notification.yml
      vars: 
        mail_subject: "Patching failed during {{patch_stage_name}} stage on host: {{inventory_hostname}}"
        mail_body: "Failed to create zip for specified directory: '{{ansible_failed_result}}' for remote '{{ansible_facts['os_family']}}' machine "
    - fail: 
        msg: "Failed to create zip for specified directory: '{{ansible_failed_result}}'"
