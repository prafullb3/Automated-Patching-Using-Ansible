---
- name: create a directory
  file:
    path: "{{ linux_temp_dir}}/{{linux_patch_dir}}"
    state: directory
- name: Installation block for RHEL 
  block:
    - name: Install red hat packages ¯
      yum:
        name: "*"
        state: latest 
        exclude: "{{ exclude_packges }}"
        security: "{{ yum_only_install_security_patch }}"
      register: patch_result 

    - name: Reboot 
      reboot: 
        reboot_timeout: "{{reboot_timeout}}"
        post_reboot_delay: "{{post_reboot_delay}}"
      when: machine_reboot
  when: yum_update
  rescue:
    - name: Trigger notification
      include_role:
        name: post_patching
        tasks_from: notification.yml
      vars:
        mail_subject: "Patching failed during patch stage on host: {{ inventory_hostname }}"
        mail_body: "Error while yum update: '{{ ansible_failed_task.name }}' for remote '{{ ansible_facts['os_family'] }}' machine"
    - fail:
        msg: "Error while yum update: '{{ ansible_failed_task.name }}' for remote '{{ ansible_facts['os_family'] }}' machine"