---
- name: create a directory
  file:
    path: "{{ linux_temp_dir}}/{{linux_patch_dir}}"
    state: directory
- name: Installation block for Ubuntu 
  block:
    - name: Update Ubuntu
      shell: sudo apt-get update && sudo apt-get upgrade -o Dir::Etc::SourceList=/etc/apt/security.sources.list

    - name: Reboot 
      reboot: 
        reboot_timeout: "{{reboot_timeout}}"
        post_reboot_delay: "{{post_reboot_delay}}"
      when: machine_reboot
  when: yum_update
  rescue:
    - name: Trigger notification
      include_role:
        name: post_patching
        tasks_from: notification.yml
      vars:
        mail_subject: "Patching failed during patch stage on host: {{ inventory_hostname }}"
        mail_body: "Error while apt update: '{{ ansible_failed_task.name }}' for remote '{{ ansible_facts['distribution'] | lower }}' machine"
    - fail:
        msg: "Error while apt update: '{{ ansible_failed_task.name }}' for remote '{{ ansible_facts['distribution'] | lower }}' machine"