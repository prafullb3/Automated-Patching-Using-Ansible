---
- name: Patch confirmation
  block:
    - name: "Generate time stamp for file"
      set_fact:
        time_stamp: "{{ '%d %b %Y' | strftime(ansible_date_time.epoch) }}"
        time_stamp_snapshot: "{{ ansible_date_time.year }}{{ ansible_date_time.month }}{{ ansible_date_time.day }}"
    - name: Get list of installed packages
      shell: rpm -qa --last > "{{ linux_temp_dir.rstrip('/') }}/{{ linux_patch_dir }}/{{ ansible_distribution }}_installed_package_details_with_date_till_{{ time_stamp_snapshot }}.txt"
      ignore_errors: true
    - name: Get list of installed packages from yum 
      shell: yum list installed > "{{linux_temp_dir.rstrip('/')}}/{{ linux_patch_dir }}/{{ ansible_distribution }}_all_installed_packages_till_{{ time_stamp_snapshot }}.txt"
  rescue:
    - name: Trigger notification
      include_role:
        name: post_patching
        tasks_from: notification.yml
      vars:
        mail_subject: "Patching failed during patch stage on host: {{ inventory_hostname }}"
        mail_body: "Failed to confirm linux patch"
    - fail:
        msg: "Failed to confirm linux patch"